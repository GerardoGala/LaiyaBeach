<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall of Fame | ILCA Sailing Simulator</title>
    <link rel="stylesheet" href="css/shared.css">
</head>
<body class="body-flex-center">

    <div class="board-container">
        <header class="board-header">
            <h1>Global Leaderboard ⛵</h1>
            <p>The Top 10 Fastest Sailors</p>
        </header>

        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Sailor</th>
                    <th>Wind</th>
                    <th>Date</th>
                    <th style="text-align: right;">Time</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                <tr><td colspan="5" style="text-align:center; padding: 40px;">Checking the race results...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="nav-links">
        <button id="shareBoardBtn" class="btn btn-secondary">
            Share Leaderboard 🌐
        </button>
        <a href="index.html" class="btn btn-primary">Back to Dock</a>
        <a href="game.html" class="btn btn-success">New Race</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_ayepAzJV_vfV5Qh8m52tGnn1Iw7CRnY",
            authDomain: "laser-sailing-simulator.firebaseapp.com",
            projectId: "laser-sailing-simulator",
            storageBucket: "laser-sailing-simulator.firebasestorage.app",
            messagingSenderId: "45397375888",
            appId: "1:45397375888:web:1ca8d7688170787624d115"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function initBoard() {
            const tableBody = document.getElementById('leaderboardBody');
            
            try {
                const leaderboardRef = collection(db, "leaderboard");
                const q = query(leaderboardRef, orderBy("finalTime", "asc"), limit(10));
                
                const querySnapshot = await getDocs(q);
                tableBody.innerHTML = ''; 

                if (querySnapshot.empty) {
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No records yet! Be the first to sail.</td></tr>';
                    return;
                }

                let rank = 1;
                querySnapshot.forEach((doc) => {
                    const entry = doc.data();
                    
                    const sailor = entry.sailorName || "Anonymous Skipper";
                    const time = entry.finalTime ? Number(entry.finalTime).toFixed(2) : "N/A";
                    
                    const wind = entry.windStrength !== undefined ? entry.windStrength : "N/A";
                    
                    let dateDisplay = "N/A";
                    if (entry.timestamp) {
                        const dateObj = entry.timestamp.toDate ? entry.timestamp.toDate() : new Date(entry.timestamp);
                        dateDisplay = dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                    }

                    let rankDisplay = `#${rank}`;
                    if(rank === 1) rankDisplay = '🏆';
                    if(rank === 2) rankDisplay = '🥈';
                    if(rank === 3) rankDisplay = '🥉';

                    const row = `
                        <tr>
                            <td class="rank">${rankDisplay}</td>
                            <td class="sailor-name">${sailor}</td>
                            <td class="wind-strength">${wind}kts</td>
                            <td class="race-date">${dateDisplay}</td>
                            <td class="time">${time}s</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                    rank++;
                });

            } catch (err) {
                console.error("Board error:", err);
                tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">
                    Error: ${err.code || err.message}
                </td></tr>`;
            }
        }

        document.getElementById('shareBoardBtn').onclick = async () => {
            try {
                await navigator.share({
                    title: 'Laser Sailing Hall of Fame',
                    text: 'Check out the top times on the Laser Sailing Simulator! ⛵',
                    url: "https://gerardogala.github.io/LaserSailingSimulator/scoreBoard.html"
                });
            } catch (err) { console.log('Share ignored'); }
        };

        initBoard();
    </script>
</body>
</html>
