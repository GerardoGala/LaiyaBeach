<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Coaching Assessment</title>
  <style>
    /* --- STATIC LAYOUT STYLES --- */

    h2 {
      margin-top: 0;
      color: #007bff;
      font-size: 1.5rem;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 10px;
    }
    .disclaim {
      color: #dc3545;
      font-size: 0.85rem;
      font-weight: bold;
      background: #fdf3f4;
      padding: 8px 12px;
      border-left: 4px solid #dc3545;
      margin-bottom: 15px;
    }
    
    /* --- NEW STATIC COACHING CARD CLASSES --- */
    .tips-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0;
      margin: 0;
    }
    .tip-item {
      background: #f8f9fa; 
      border-left: 4px solid #ffc107; /* Amber alert line */
      padding: 12px;
      font-size: 0.95rem;
      color: #222222 !important; /* Protect visibility from external stylesheet leaks */
      border-radius: 0 4px 4px 0;
      line-height: 1.4;
    }
    .tip-item.critical-error {
      border-left-color: #dc3545; /* Red alert line for capsizes/irons */
      background: #fff5f5;
      color: #222222 !important;
    }
    .tip-control-name {
      color: #007bff; 
      font-weight: bold;
    }
    .tip-target-value {
      color: #28a745; 
      font-weight: bold;
    }
    .perfect-badge {
      background: #d4edda;
      color: #155724;
      padding: 15px;
      border-radius: 4px;
      font-weight: bold;
      border-left: 4px solid #28a745;
    }
    /* Body and font styles go here (Keep your existing static style rules exactly as they are!) */
  </style>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>

  <h2>AI Coaching Assessment</h2>
  <div class="disclaim">
    ⚠️ NOTICE: Seeking coach assistance has officially disqualified this run from the Leaderboard.
  </div>

  <!-- Dynamic content zone acting as independent scroll sandbox wrapper -->
  <div id="aiCoachContent" style="display: flex; flex-direction: column; height: calc(100vh - 100px); overflow-y: auto; padding-right: 5px; box-sizing: border-box;">
    Calculating metrics...
  </div>

  <!-- Squeaky clean evaluation trigger block -->
  <script type="module">
    // Import the standalone decoupled rules engine file we just made!
    import { evaluateSnapshot } from './js/askAiEvaluateSnapshot.js';

    const sim = window.parent.globalSimulationData;
    const container = document.getElementById("aiCoachContent");

    // Execute the imported engine pass smoothly
    evaluateSnapshot(sim, container);
  </script>
</body>
</html>
