<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall of Fame | Laser Sailing Simulator</title>
    <style>
        :root {
            --primary-blue: #007bff;
            --navy: #0056b3;
            --light-bg: #f8fafc;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--light-bg); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
            margin: 0;
        }
        .board-container { 
            background: white; 
            padding: 2rem; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 95%; 
            max-width: 600px; 
            margin-top: 20px;
        }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--navy); margin: 0; font-size: 2rem; }
        p { color: #666; margin-top: 5px; }
        
        /* Input Form Elements */
        .input-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .input-form input {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
        }
        .input-form button {
            padding: 10px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .input-form button:hover {
            background: var(--navy);
        }
    </style>
</head>
<body>

    <div class="board-container">
        <header>
            <h1>Submit Race Result</h1>
            <p>Enter your name to the leaderboard</p>
        </header>

        <!-- Submission Form Interface -->
        <form id="submissionForm" class="input-form">
            <input type="text" name="sailorName" id="sailorNameInput" placeholder="Enter Name" required autocomplete="off">
            <button type="submit" id="submitBtn">Enter Name</button>
        </form>
    </div>
<script src="js/globalSimulationData.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, limit, getDocs, addDoc, writeBatch, serverTimestamp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC_ayepAzJV_vfV5Qh8m52tGnn1Iw7CRnY",
        authDomain: "laser-sailing-simulator.firebaseapp.com", // FIXED: Cleaned up incorrect domain path
        projectId: "laser-sailing-simulator",
        storageBucket: "laser-sailing-simulator.firebasestorage.app",
        messagingSenderId: "45397375888",
        appId: "1:145397375888:web:1ca8d7688170787624d115"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const leaderboardRef = collection(db, "leaderboard");

    document.getElementById('submissionForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const formElement = e.target;
        
        const formData = new FormData(formElement);
        const sailorName = formData.get('sailorName')?.trim();

        if (!sailorName) return;

        // FIXED: Extract parameters from URL and parse time as an integer to maintain whole seconds
        const urlParams = new URLSearchParams(window.location.search);
        const finalTime = parseInt(urlParams.get('time'), 10) || 0;
        const windStrength = parseFloat(urlParams.get('wind')) || 0;

        try {
            submitBtn.disabled = true;
            submitBtn.textContent = "Saving...";

            await addDoc(leaderboardRef, {
                sailorName: sailorName,
                windStrength: windStrength,
                finalTime: finalTime, // Saves clean integer seconds (e.g., 630) directly to Firestore
                timestamp: serverTimestamp() 
            });

            // FIXED: Cleaned up formatting string to show explicit seconds unit label
            alert(`Successfully recorded!\n\nSailor: ${sailorName}\nTime: ${finalTime} sec\nWind: ${windStrength.toFixed(1)} kts`);
            window.location.href = "leaderboard.html";

        } catch (err) {
            console.error("Firestore Error:", err);
            alert(`Submission error: ${err.message}`);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Enter Name";
        }
    });
</script>
</body>
</html>
