<!-- controls.html -->
<div class="left-pane">
  <div id="notification-container"></div>
  <!-- Rigging Controls -->
    <div id="sheetControl" style="background: rgba(0,0,0,0.1); padding: 6px; border-radius: 8px; text-align: center;">
      <div style="font-weight: bold; color: white; margin-top: 8px; grid-column: 1 / -1;">
        SHEET CONTROL
      </div>
      <button id="btnSheet90" class="control-button" onclick="executeSheet(20)">20</button>
      <button id="btnSheetPlus" class="control-button" onclick="window.adjustSheet(-1)"
              style="background: white; color: black; font-weight: bold;">-1°</button>
      <button id="btnSheetMinus" class="control-button" onclick="window.adjustSheet(+1)"
              style="background: white; color: black; font-weight: bold;">+1°</button>
      <button id="btnSheet20" class="control-button" onclick="executeSheet(90)">90</button>
    </div>

    <div id="daggerboardControl" style="background: rgba(0,0,0,0.1); padding: 6px; border-radius: 8px; text-align: center;">
      <div style="font-weight: bold; color: white; margin-top: 8px; grid-column: 1 / -1;">
        DAGGERBOARD CONTROL
      </div>
      <button id="btnSheet90" class="control-button" onclick="executeSheet90()">-2</button>
      <button id="btnSheet90" class="control-button" onclick="executeSheet90()">-1</button>
      <button id="btnSheetPlus" class="control-button" onclick="window.adjustSheet(1)">0</button>
      <button id="btnSheetMinus" class="control-button" onclick="window.adjustSheet(-1)">1</button>
      <button id="btnSheet20" class="control-button" onclick="executeSheet20()">2</button>
    </div>

    <div id="sailorPositionControl" style="background: rgba(0,0,0,0.1); padding: 2px; text-align: center;">
      <div style="font-weight: bold; color: white; margin-top: 6px; grid-column: 1 / -1;">
        SAILOR POSITION
      </div>
      <div>
        <button id="btnSheet90" class="control-button" onclick="executeSailorPosition(-2)">Aft</button>
      </div>
      <div>
        <button id="btnSheet90" class="control-button" onclick="executeSailorPosition(-1)">Hike Out</button>
        <button id="btnSheetPlus" class="control-button" onclick="executeSailorPosition(0)">Mid Center</button>
        <button id="btnSheetMinus" class="control-button" onclick="executeSailorPosition(1)">Leeward</button>
      </div>
      <div>
        <button id="btnSheet20" class="control-button" onclick="executeSailorPosition(2)">Fore</button>
      </div>
    </div>
    <br>
    <div style="background: rgba(0,0,0,0.1); padding: 2px; text-align: center;">
      <button id="btnSheet20" class="control-button" onclick="executePump">PUMP</button>
    </div>
    <div class="maneuver-controls" style="background: rgba(0,0,0,0.1); padding: 2px; text-align: center;">
      <div style="font-weight: bold; color: white; margin-top: 6px; grid-column: 1 / -1;">
        ILCA HEADING
      </div>
      <div class="row">
        <button onclick="showNotification('Port Tack!'); window.globalSimulationData.ILCA.maneuver = 'tack-port'">Port Tack</button>
        <button onclick="showNotification('Starboard Tack!'); window.globalSimulationData.ILCA.maneuver = 'tack-starboard'">Starboard Tack</button>
      </div>
      <div class="row">
        <button onclick="showNotification('-1 Heading'); window.globalSimulationData.ILCA.heading =
          (window.globalSimulationData.ILCA.heading - 1 + 360) % 360">-1°</button>
        <button onclick="showNotification('+1 Heading'); window.globalSimulationData.ILCA.heading =
          (window.globalSimulationData.ILCA.heading + 1) % 360">+1°</button>
      </div>
      <div class="row">
        <button onclick="showNotification('Port Gybe!'); window.globalSimulationData.ILCA.maneuver = 'gybe-port'">Port Gybe</button>
        <button onclick="showNotification('Starboard Tack!'); window.globalSimulationData.ILCA.maneuver = 'gybe-starboard'">Starboard Gybe</button>
      </div>
    </div>

    <div id="tuningControlsGroup" class="right-3col">
      <div class="cell">
        <!-- VANG -->
        <svg id="vangControl" width="60" height="150" viewBox="0 0 60 150">
          <rect x="0" y="0" width="60" height="20" rx="4" fill="#333"></rect>
          <text x="30" y="14" text-anchor="middle" fill="white"
                style="font-family: Arial; font-size: 9px; font-weight: bold;">VANG</text>
          <g style="cursor: pointer;" onclick="updateControl('vang', 1)">
            <rect x="5" y="25" width="50" height="40" rx="8" fill="#28a745"></rect>
            <text x="30" y="52" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 30px; font-weight: bold;">+</text>
          </g>
          <rect x="5" y="70" width="50" height="30" rx="4" fill="white" stroke="#ccc"></rect>
          <text id="vangValue" data-vang="0" x="30" y="92" text-anchor="middle" fill="#333"
                style="font-family: monospace; font-size: 20px; font-weight: bold;">0</text>
          <g style="cursor: pointer;" onclick="updateControl('vang', -1)">
            <rect x="5" y="105" width="50" height="40" rx="8" fill="#dc3545"></rect>
            <text x="30" y="132" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 35px; font-weight: bold;">-</text>
          </g>
        </svg>
      </div>

      <div class="cell">
        <!-- DOWNHAUL -->
        <svg id="downhaulControl" width="60" height="150" viewBox="0 0 60 150">
          <rect x="0" y="0" width="60" height="20" rx="4" fill="#333"></rect>
          <text x="30" y="14" text-anchor="middle" fill="white"
                style="font-family: Arial; font-size: 8px; font-weight: bold;">DOWNHAUL</text>
          <g style="cursor: pointer;" onclick="updateControl('downhaul', 1)">
            <rect x="5" y="25" width="50" height="40" rx="8" fill="#28a745"></rect>
            <text x="30" y="52" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 30px; font-weight: bold;">+</text>
          </g>
          <rect x="5" y="70" width="50" height="30" rx="4" fill="white" stroke="#ccc"></rect>
          <text id="downhaulValue" data-downhaul="0" x="30" y="92" text-anchor="middle" fill="#333"
                style="font-family: monospace; font-size: 20px; font-weight: bold;">0</text>
          <g style="cursor: pointer;" onclick="updateControl('downhaul', -1)">
            <rect x="5" y="105" width="50" height="40" rx="8" fill="#dc3545"></rect>
            <text x="30" y="132" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 35px; font-weight: bold;">-</text>
          </g>
        </svg>
      </div>

      <div class="cell">
        <!-- OUTHAUL -->
        <svg id="outhaulControl" width="60" height="150" viewBox="0 0 60 150">
          <rect x="0" y="0" width="60" height="20" rx="4" fill="#333"></rect>
          <text x="30" y="14" text-anchor="middle" fill="white"
                style="font-family: Arial; font-size: 9px; font-weight: bold;">OUTHAUL</text>
          <g style="cursor: pointer;" onclick="updateControl('outhaul', 1)">
            <rect x="5" y="25" width="50" height="40" rx="8" fill="#28a745"></rect>
            <text x="30" y="52" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 30px; font-weight: bold;">+</text>
          </g>
          <rect x="5" y="70" width="50" height="30" rx="4" fill="white" stroke="#ccc"></rect>
          <text id="outhaulValue" data-outhaul="0" x="30" y="92" text-anchor="middle" fill="#333"
                style="font-family: monospace; font-size: 20px; font-weight: bold;">0</text>
          <g style="cursor: pointer;" onclick="updateControl('outhaul', -1)">
            <rect x="5" y="105" width="50" height="40" rx="8" fill="#dc3545"></rect>
            <text x="30" y="132" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 35px; font-weight: bold;">-</text>
          </g>
        </svg>
      </div>
    </div>
</div>
