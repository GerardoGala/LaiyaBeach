<!-- Controls Partial -->
<div class="left-pane">
  <!-- Icon Buttons (Top Left) -->
  <div class="tabs">
    <span class="material-icons open-dialog" data-target="leaderboardDialog">leaderboard</span>
    <span class="material-icons open-dialog" data-target="helpDialog">help_outline</span>
  </div>

  <!-- Rigging Controls -->
  <div id="rigging" class="tab-content active">
    <div id="sheetControl" class="right-4col cell" data-angle="15"
         style="background: rgba(0,0,0,0.1); padding: 6px; border-radius: 8px; text-align: center;">
      <div style="font-weight: bold; color: white; margin-top: 8px; grid-column: 1 / -1;">
        SHEET CONTROL
      </div>
      <button id="btnSheet90" class="control-button" onclick="executeSheet90()">90</button>
      <button id="btnSheetPlus" class="control-button"
              onclick="window.adjustSheet(1)"
              style="background: white; color: black; font-weight: bold;">+1°</button>
      <button id="btnSheetMinus" class="control-button"
              onclick="window.adjustSheet(-1)"
              style="background: white; color: black; font-weight: bold;">-1°</button>
      <button id="btnSheet20" class="control-button" onclick="executeSheet20()">20</button>
    </div>

    <div class="maneuver-controls">
      <h3>ILCA HEADING</h3>
      <div class="row">
        <button onclick="window.globalSimulationData.ILCA.maneuver = 'tack-port'">Port Tack</button>
        <button onclick="window.globalSimulationData.ILCA.maneuver = 'tack-starboard'">Starboard Tack</button>
      </div>
      <div class="row">
        <button onclick="window.globalSimulationData.ILCA.heading =
          (window.globalSimulationData.ILCA.heading - 1 + 360) % 360">-1°</button>
        <button onclick="window.globalSimulationData.ILCA.heading =
          (window.globalSimulationData.ILCA.heading + 1) % 360">+1°</button>
      </div>
      <div class="row">
        <button onclick="window.globalSimulationData.ILCA.maneuver = 'gybe-port'">Port Gybe</button>
        <button onclick="window.globalSimulationData.ILCA.maneuver = 'gybe-starboard'">Starboard Gybe</button>
      </div>
    </div>

    <div id="tuningControlsGroup" class="right-3col">
      <!-- Vang, Downhaul, Outhaul SVG blocks -->
      <!-- (keep the full SVG markup here as in your original file) -->
    </div>
  </div>

  <!-- Permanent Status -->
  <div class="status">
    <h4>Wind</h4>
    <p id="windStatus">Wind data loading...</p>
  </div>
  <div class="status">
    <h4>ILCA</h4>
    <p id="ilcaStatus">ILCA data loading...</p>
  </div>
  <div class="status">
    <h4>Timer:</h4>
    <p id="timer"></p>
  </div>
</div>
