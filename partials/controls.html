<!-- controls.html -->
<div class="left-pane">
  <!-- Icon Buttons (Top Left) -->
  <div class="tabs">
    <span class="material-icons open-dialog" data-target="leaderboardDialog">leaderboard</span>
    <span class="material-icons open-dialog" data-target="helpDialog">help_outline</span>
  </div>

    <!-- Status -->
  <div id="rigging" class="tab-content active">
    <div class="status">
      <p id="windStatus">Wind data loading...</p>
    </div>
    <div class="status">
      <p id="ilcaStatus">ILCA data loading...</p>
    </div>
    <div class="status">
      <p id="timer"></p>
    </div>
  </div>

  <!-- Rigging Controls -->


    <div id="sheetControl" class="right-4col cell" data-angle="15"
         style="background: rgba(0,0,0,0.1); padding: 6px; border-radius: 8px; text-align: center;">
      <div style="font-weight: bold; color: white; margin-top: 8px; grid-column: 1 / -1;">
        SHEET CONTROL
      </div>
      <button id="btnSheet90" class="control-button" onclick="executeSheet90()">90</button>
      <button id="btnSheetPlus" class="control-button"
              onclick="window.adjustSheet(1)"
              style="background: white; color: black; font-weight: bold;">+1°</button>
      <button id="btnSheetMinus" class="control-button"
              onclick="window.adjustSheet(-1)"
              style="background: white; color: black; font-weight: bold;">-1°</button>
      <button id="btnSheet20" class="control-button" onclick="executeSheet20()">20</button>
    </div>
    <br>
            <!-- Sailor Position Control -->
    <div class="sailor-position-control">
      <h3>Sailor Position</h3>
      <div class="cockpit">
        <div class="row">
          <button onclick="window.globalSimulationData.ILCA.sailor.hike = 'out'">&lt;-</button>
          <button onclick="window.globalSimulationData.ILCA.sailor.hike = 'in'">-&gt;</button>
        </div>
        <div class="row">
          <button onclick="window.globalSimulationData.ILCA.sailor.position = 'forward'">^</button>
        </div>
        <div class="row">
          <button onclick="window.globalSimulationData.ILCA.sailor.position = 'aft'">v</button>
        </div>
      </div>
    </div>
    <br>
    <div class="maneuver-controls">
      <div class="row">
        <button onclick="window.globalSimulationData.ILCA.maneuver = 'tack-port'">Port Tack</button>
        <button onclick="window.globalSimulationData.ILCA.maneuver = 'tack-starboard'">Starboard Tack</button>
      </div>
      <div class="row">
        <button onclick="window.globalSimulationData.ILCA.heading =
          (window.globalSimulationData.ILCA.heading - 1 + 360) % 360">-1°</button>
        <button onclick="window.globalSimulationData.ILCA.heading =
          (window.globalSimulationData.ILCA.heading + 1) % 360">+1°</button>
      </div>
      <div class="row">
        <button onclick="window.globalSimulationData.ILCA.maneuver = 'gybe-port'">Port Gybe</button>
        <button onclick="window.globalSimulationData.ILCA.maneuver = 'gybe-starboard'">Starboard Gybe</button>
      </div>
    </div>
    <br>

    <div id="tuningControlsGroup" class="right-3col">
      <div class="cell">
        <!-- VANG -->
        <svg id="vangControl" width="60" height="150" viewBox="0 0 60 150">
          <rect x="0" y="0" width="60" height="20" rx="4" fill="#333"></rect>
          <text x="30" y="14" text-anchor="middle" fill="white"
                style="font-family: Arial; font-size: 9px; font-weight: bold;">VANG</text>
          <g style="cursor: pointer;" onclick="updateControl('vang', 1)">
            <rect x="5" y="25" width="50" height="40" rx="8" fill="#28a745"></rect>
            <text x="30" y="52" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 30px; font-weight: bold;">+</text>
          </g>
          <rect x="5" y="70" width="50" height="30" rx="4" fill="white" stroke="#ccc"></rect>
          <text id="vangValue" data-vang="0" x="30" y="92" text-anchor="middle" fill="#333"
                style="font-family: monospace; font-size: 20px; font-weight: bold;">0</text>
          <g style="cursor: pointer;" onclick="updateControl('vang', -1)">
            <rect x="5" y="105" width="50" height="40" rx="8" fill="#dc3545"></rect>
            <text x="30" y="132" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 35px; font-weight: bold;">-</text>
          </g>
        </svg>
      </div>

      <div class="cell">
        <!-- DOWNHAUL -->
        <svg id="downhaulControl" width="60" height="150" viewBox="0 0 60 150">
          <rect x="0" y="0" width="60" height="20" rx="4" fill="#333"></rect>
          <text x="30" y="14" text-anchor="middle" fill="white"
                style="font-family: Arial; font-size: 8px; font-weight: bold;">DOWNHAUL</text>
          <g style="cursor: pointer;" onclick="updateControl('downhaul', 1)">
            <rect x="5" y="25" width="50" height="40" rx="8" fill="#28a745"></rect>
            <text x="30" y="52" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 30px; font-weight: bold;">+</text>
          </g>
          <rect x="5" y="70" width="50" height="30" rx="4" fill="white" stroke="#ccc"></rect>
          <text id="downhaulValue" data-downhaul="0" x="30" y="92" text-anchor="middle" fill="#333"
                style="font-family: monospace; font-size: 20px; font-weight: bold;">0</text>
          <g style="cursor: pointer;" onclick="updateControl('downhaul', -1)">
            <rect x="5" y="105" width="50" height="40" rx="8" fill="#dc3545"></rect>
            <text x="30" y="132" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 35px; font-weight: bold;">-</text>
          </g>
        </svg>
      </div>

      <div class="cell">
        <!-- OUTHAUL -->
        <svg id="outhaulControl" width="60" height="150" viewBox="0 0 60 150">
          <rect x="0" y="0" width="60" height="20" rx="4" fill="#333"></rect>
          <text x="30" y="14" text-anchor="middle" fill="white"
                style="font-family: Arial; font-size: 9px; font-weight: bold;">OUTHAUL</text>
          <g style="cursor: pointer;" onclick="updateControl('outhaul', 1)">
            <rect x="5" y="25" width="50" height="40" rx="8" fill="#28a745"></rect>
            <text x="30" y="52" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 30px; font-weight: bold;">+</text>
          </g>
          <rect x="5" y="70" width="50" height="30" rx="4" fill="white" stroke="#ccc"></rect>
          <text id="outhaulValue" data-outhaul="0" x="30" y="92" text-anchor="middle" fill="#333"
                style="font-family: monospace; font-size: 20px; font-weight: bold;">0</text>
          <g style="cursor: pointer;" onclick="updateControl('outhaul', -1)">
            <rect x="5" y="105" width="50" height="40" rx="8" fill="#dc3545"></rect>
            <text x="30" y="132" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 35px; font-weight: bold;">-</text>
          </g>
        </svg>
      </div>
    </div>



    <div class="maneuver-controls">
        test
    </div>
    <div class="tab-content active">
      <button onclick="window.globalSimulationData.ILCA.sailor.hike = 'out'">Nudge</button>
    </div>
</div>


<style>
/* Status styles */
.status {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.status h4 {
  font-size: 1.4rem;
  font-weight: bold;
  margin: 0;
}

.status p {
  margin: 0;
  font-size: 1rem;
  color: #d4d4d4;
}

/* Sailor Position Control */
.sailor-position-control {
  margin-top: 16px;
}

.cockpit {
  display: flex;
  flex-direction: column;   /* stack rows vertically */
  gap: 8px;
  border: 2px solid #888;
  padding: 12px;
  width: 160px;
  background-color: #222;
}

.cockpit .row {
  display: flex;
  justify-content: center;
  gap: 8px;
}

.cockpit button {
  font-size: 1.2rem;
  padding: 6px 10px;
  cursor: pointer;
}

/* Reset page defaults and prevent whole-page scroll */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;          /* stop the entire page from scrolling */
}

/* Left pane: fixed width, full height, scrollable */
.left-pane {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;                 /* stretch full height */
  width: 300px;              /* fixed width for controls */
  overflow-y: auto;          /* scroll only inside left pane */
  background-color: #111;
}

/* Map fills the rest of the screen */
#map {
  position: absolute;
  top: 0;
  left: 300px;               /* same as left-pane width */
  right: 0;
  bottom: 0;
}


</style>
