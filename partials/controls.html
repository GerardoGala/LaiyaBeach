<!-- controls.html -->
<div class="left-pane">
  <div id="notification-container"></div>
  <!-- Rigging Controls -->
    <div id="sheetControl" style="background: rgba(0,0,0,0.1); padding: 6px; border-radius: 8px; text-align: center;">
      <div id="sheetControlDiv" style="font-weight: bold; color: white; margin-top: 8px; grid-column: 1 / -1;">
        SHEET CONTROL = 20
      </div>
      <button class="control-button" 
            onclick="showNotification('Sheet 20');
            window.globalSimulationData.ILCA.sheet = 20;
            document.getElementById('sheetControlDiv').textContent = 
            'SHEET CONTROL = 20'">20</button>
      <button class="control-button"
            onclick="showNotification('Sheet -1');
            window.globalSimulationData.ILCA.sheet = window.globalSimulationData.ILCA.sheet - 1;
            document.getElementById('sheetControlDiv').textContent = 
            'SHEET CONTROL = ' + window.globalSimulationData.ILCA.sheet;"
            style="background: white; color: black; font-weight: bold;">-1°</button>
      <button class="control-button" 
            onclick="showNotification('Sheet +1');
            window.globalSimulationData.ILCA.sheet = window.globalSimulationData.ILCA.sheet + 1;
            document.getElementById('sheetControlDiv').textContent = 
            'SHEET CONTROL = ' + window.globalSimulationData.ILCA.sheet;"
            style="background: white; color: black; font-weight: bold;">+1°</button>
      <button class="control-button" 
            onclick="showNotification('Sheet 90');
            window.globalSimulationData.ILCA.sheet = 90;
            document.getElementById('sheetControlDiv').textContent = 
            'SHEET CONTROL = 90'">90</button>
    </div>
    <div style="background: rgba(0,0,0,0.1); padding: 6px; border-radius: 8px; text-align: center;">
      <div id="daggerboardControlDiv" style="font-weight: bold; color: white; margin-top: 8px; grid-column: 1 / -1;">
        DAGGERBOARD CONTROL = 0
      </div>
      <button class="control-button"
            onclick="showNotification('Daggerboard -2');
            window.globalSimulationData.ILCA.daggerboard = -2;
            document.getElementById('daggerboardControlDiv').textContent = 
            'DAGGERBOARD CONTROL = -2';">-2</button>
      <button class="control-button"
            onclick="showNotification('Daggerboard -1');
            window.globalSimulationData.ILCA.daggerboard = -1;
            document.getElementById('daggerboardControlDiv').textContent = 
            'DAGGERBOARD CONTROL = -1';">-1</button>
      <button class="control-button"
            onclick="showNotification('Daggerboard 0');
            window.globalSimulationData.ILCA.daggerboard = 0;
            document.getElementById('daggerboardControlDiv').textContent = 
            'DAGGERBOARD CONTROL = 0';">0</button>
      <button class="control-button" 
            onclick="showNotification('Daggerboard +1');
            window.globalSimulationData.ILCA.daggerboard = 1;
            document.getElementById('daggerboardControlDiv').textContent = 
            'DAGGERBOARD CONTROL = 1';">1</button>
      <button class="control-button"
            onclick="showNotification('Daggerboard +2');
            window.globalSimulationData.ILCA.daggerboard = 2;
            document.getElementById('daggerboardControlDiv').textContent = 
            'DAGGERBOARD CONTROL = 2';">2</button>
    </div>

    <div id="sailorPositionControl" style="background: rgba(0,0,0,0.1); padding: 2px; text-align: center;">
      <div id="sailorPositionLabel" style="font-weight: bold; color: white; margin-top: 6px; grid-column: 1 / -1;">
        SAILOR POSITION = Mid Center
      </div>
      <div>
        <button class="control-button" onclick="updateSailorPosition('Fore')">Fore</button>
      </div>
      <div>
        <button class="control-button" onclick="updateSailorPosition('Hike Out')">Hike Out</button>
        <button class="control-button" onclick="updateSailorPosition('Mid Center')">Mid Center</button>
        <button class="control-button" onclick="updateSailorPosition('Leeward')">Leeward</button>
      </div>
      <div>
        <button class="control-button" onclick="updateSailorPosition('Aft')">Aft</button>
      </div>
    </div>
    <br>
    <div style="background: rgba(0,0,0,0.1); padding: 2px; text-align: center;">
      <button class="control-button" onclick="showNotification('Pump!'); window.globalSimulationData.ILCA.maneuver = 'pump'">PUMP</button>
    </div>
    <div class="maneuver-controls" style="background: rgba(0,0,0,0.1); padding: 2px; text-align: center;">
      <div style="font-weight: bold; color: white; margin-top: 6px; grid-column: 1 / -1;">
        ILCA HEADING
      </div>
      <div class="row">
        <button onclick="showNotification('Port Tack!'); window.globalSimulationData.ILCA.maneuver = 'tack-port'">Port Tack</button>
        <button onclick="showNotification('Starboard Tack!'); window.globalSimulationData.ILCA.maneuver = 'tack-starboard'">Starboard Tack</button>
      </div>
      <div class="row">
        <button onclick="showNotification('-1 Heading'); window.globalSimulationData.ILCA.heading =
          (window.globalSimulationData.ILCA.heading - 1 + 360) % 360">-1°</button>
        <button onclick="showNotification('+1 Heading'); window.globalSimulationData.ILCA.heading =
          (window.globalSimulationData.ILCA.heading + 1) % 360">+1°</button>
      </div>
      <div class="row">
        <button onclick="showNotification('Port Gybe!'); window.globalSimulationData.ILCA.maneuver = 'gybe-port'">Port Gybe</button>
        <button onclick="showNotification('Starboard Gybe!'); window.globalSimulationData.ILCA.maneuver = 'gybe-starboard'">Starboard Gybe</button>
      </div>
    </div>

    <div id="tuningControlsGroup" class="right-3col">
      <div class="cell">
        <!-- VANG -->
        <svg id="vangControl" width="60" height="110" viewBox="0 0 60 110">
          <rect x="0" y="0" width="60" height="20" rx="4" fill="#333"></rect>
          <text x="30" y="14" text-anchor="middle" fill="white"
                style="font-family: Arial; font-size: 9px; font-weight: bold;">VANG</text>
          <g style="cursor: pointer;" onclick="
          if (window.globalSimulationData.ILCA.vang < 5) {
            window.globalSimulationData.ILCA.vang += 1;
          }  
          showNotification('Vang = ' + window.globalSimulationData.ILCA.vang);">
            <rect x="5" y="25" width="50" height="40" rx="8" fill="#28a745"></rect>
            <text x="30" y="52" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 30px; font-weight: bold;">+</text>
          </g>
          <g style="cursor: pointer;" onclick="
          if (window.globalSimulationData.ILCA.vang > -5) {
            window.globalSimulationData.ILCA.vang -= 1;
          }  
          showNotification('Vang = ' + window.globalSimulationData.ILCA.vang);">
            <rect x="5" y="65" width="50" height="40" rx="8" fill="#dc3545"></rect>
            <text x="30" y="92" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 35px; font-weight: bold;">-</text>
          </g>
        </svg>
      </div>

      <div class="cell">
        <!-- DOWNHAUL -->
        <svg id="downhaulControl" width="60" height="110" viewBox="0 0 60 110">
          <rect x="0" y="0" width="60" height="20" rx="4" fill="#333"></rect>
          <text x="30" y="14" text-anchor="middle" fill="white"
                style="font-family: Arial; font-size: 8px; font-weight: bold;">DOWNHAUL</text>
          <g style="cursor: pointer;" onclick="
          if (window.globalSimulationData.ILCA.downhaul < 5) {
            window.globalSimulationData.ILCA.downhaul += 1;
          }  
          showNotification('Downhaul = ' + window.globalSimulationData.ILCA.downhaul);">
            <rect x="5" y="25" width="50" height="40" rx="8" fill="#28a745"></rect>
            <text x="30" y="52" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 30px; font-weight: bold;">+</text>
          </g>
          <g style="cursor: pointer;" onclick="
          if (window.globalSimulationData.ILCA.downhaul > -5) {
            window.globalSimulationData.ILCA.downhaul -= 1;
          }  
          showNotification('Downhaul= ' + window.globalSimulationData.ILCA.downhaul);">
            <rect x="5" y="65" width="50" height="40" rx="8" fill="#dc3545"></rect>
            <text x="30" y="92" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 35px; font-weight: bold;">-</text>
          </g>
        </svg>
      </div>

      <div class="cell">
        <!-- OUTHAUL -->
        <svg id="outhaulControl" width="60" height="110" viewBox="0 0 60 110">
          <rect x="0" y="0" width="60" height="20" rx="4" fill="#333"></rect>
          <text x="30" y="14" text-anchor="middle" fill="white"
                style="font-family: Arial; font-size: 9px; font-weight: bold;">OUTHAUL</text>
          <g style="cursor: pointer;" onclick="
          if (window.globalSimulationData.ILCA.outhaul < 5) {
            window.globalSimulationData.ILCA.outhaul += 1;
          }  
          showNotification('Outhaul = ' + window.globalSimulationData.ILCA.outhaul);">
            <rect x="5" y="25" width="50" height="40" rx="8" fill="#28a745"></rect>
            <text x="30" y="52" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 30px; font-weight: bold;">+</text>
          </g>
          <g style="cursor: pointer;" onclick="
          if (window.globalSimulationData.ILCA.outhaul > -5) {
            window.globalSimulationData.ILCA.outhaul -= 1;
          }  
          showNotification('Outhaul = ' + window.globalSimulationData.ILCA.outhaul);">
            <rect x="5" y="65" width="50" height="40" rx="8" fill="#dc3545"></rect>
            <text x="30" y="92" text-anchor="middle" fill="white"
                  style="font-family: Arial; font-size: 35px; font-weight: bold;">-</text>
          </g>
        </svg>
      </div>
    </div>
</div>
