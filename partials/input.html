<!-- input.html -->
<div id="input-pane">

  <div id="sheetControl" class="input-section active">
    <div class="control-column">
      <button class="control-button" onclick="updateSheetControl(20)">20</button>
      <button class="control-button" onclick="increaseSheetControl(-1)">-1°</button>
      <button class="control-button" onclick="increaseSheetControl(1)">+1°</button>
      <button class="control-button" onclick="updateSheetControl(90)">90</button>
    </div>
  </div>

  <div id="ilcaControl" class="input-section">
    <div class="control-column">
      <button class="control-button" onclick="showNotification('Turn Port!'); window.globalSimulationData.ILCA.maneuver = 'turn-port'">Turn Port</button>
      <button class="control-button" onclick="showNotification('ILCA Heading -5'); window.globalSimulationData.ILCA.maneuver = 'heading-minus5'">-5</button>
      <button class="control-button" onclick="showNotification('ILCA Heading -1'); window.globalSimulationData.ILCA.maneuver = 'heading-minus1'">-1</button>
      <button class="control-button" onclick="showNotification('ILCA Heading +1'); window.globalSimulationData.ILCA.maneuver = 'heading-plus1'">+1</button>
      <button class="control-button" onclick="showNotification('ILCA Heading +5'); window.globalSimulationData.ILCA.maneuver = 'heading-plus5'">+5</button>
      <button class="control-button" onclick="showNotification('Turn Starboard!'); window.globalSimulationData.ILCA.maneuver = 'turn-starboard'">Turn Starboard</button>
    </div>
  </div>

  <div id="daggerboardControl" class="input-section">
    <div class="control-column">
      <button class="control-button" onclick="updateDaggerboardControl(2)">Up</button>
      <button class="control-button" onclick="updateDaggerboardControl(1)">Mid Up</button>
      <button class="control-button" onclick="updateDaggerboardControl(0)">Center</button>
      <button class="control-button" onclick="updateDaggerboardControl(-1)">Mid Down</button>
      <button class="control-button" onclick="updateDaggerboardControl(-2)">Down</button>
    </div>
  </div>

  <div id="sailorPositionControl" class="input-section">
    <div class="control-column">
      <button class="control-button" onclick="updateSailorPosition('Fore')">Fore</button>
      <button class="control-button" onclick="updateSailorPosition('Hike Out')">Hike Out</button>
      <button class="control-button" onclick="updateSailorPosition('Mid Center')">Mid Center</button>
      <button class="control-button" onclick="updateSailorPosition('Leeward')">Leeward</button>
      <button class="control-button" onclick="updateSailorPosition('Aft')">Aft</button>
    </div>
  </div>

  <div id="vangControl" class="input-section">
    <div class="control-column">
      <button class="control-button" onclick="updateVangControl(-2)">-2</button>
      <button class="control-button" onclick="updateVangControl(-1)">-1</button>
      <button class="control-button" onclick="updateVangControl(0)">0</button>
      <button class="control-button" onclick="updateVangControl(1)">1</button>
      <button class="control-button" onclick="updateVangControl(2)">2</button>
    </div>
  </div>

  <div id="downhaulControl" class="input-section">
    <div class="control-column">
      <button class="control-button" onclick="updateDownhaulControl(-2)">-2</button>
      <button class="control-button" onclick="updateDownhaulControl(-1)">-1</button>
      <button class="control-button" onclick="updateDownhaulControl(0)">0</button>
      <button class="control-button" onclick="updateDownhaulControl(1)">1</button>
      <button class="control-button" onclick="updateDownhaulControl(2)">2</button>
    </div>
  </div>

  <div id="outhaulControl" class="input-section">
    <div class="control-column">
      <button class="control-button" onclick="updateOuthaulControl(-2)">-2</button>
      <button class="control-button" onclick="updateOuthaulControl(-1)">-1</button>
      <button class="control-button" onclick="updateOuthaulControl(0)">0</button>
      <button class="control-button" onclick="updateOuthaulControl(1)">1</button>
      <button class="control-button" onclick="updateOuthaulControl(2)">2</button>
    </div>
  </div>

</div>

<style>
/* Pane layout */
#input-pane {
  display: flex;
  flex-direction: column;
  height: 35vh;
}

.input-section {
  flex: 1;                    /* stretch to fill parent flex container */
  display: flex;              /* allow children (like .control-column) to stretch */
  flex-direction: column;     /* stack children vertically so we can distribute them */
  justify-content: space-between; /* distribute child elements evenly along vertical axis */
  padding: 8px;
  box-sizing: border-box;
}

/* Hide inactive sections while preserving layout for the active one */
.input-section:not(.active) {
  display: none;
}

/* Column distributes buttons evenly vertically */
.control-column {
  display: flex;
  flex-direction: column;
  justify-content: space-between; /* distribute child buttons evenly */
  align-items: center;   /* keep buttons centered horizontally */
  height: 100%;          /* fill the section height so space-between works */
  padding: 20px 0;       /* breathing room top/bottom */
  box-sizing: border-box;
}

/* Buttons */
.control-button {
  background:#007bff;color:white;
  border: none;             /* remove gray border */
  width: 66%;            /* 2/3 of pane width */
  padding: 12px 8px;     /* a bit taller so space-between looks better */
  cursor: pointer;
  text-align: center;
  flex: 0;               /* prevent flexbox from stretching buttons */
}


/* Optional: simple rows used elsewhere */
.row {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}
</style>
