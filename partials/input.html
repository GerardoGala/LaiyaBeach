<!-- input.html -->
<div id="input-pane">
  <div id="ilcaControl" class="input-section directional-controls  active">
    <!-- Row 1: Directional Controls (Two Columns) -->
    <div class="control-row row-directions">
      <button class="control-button button-port" onclick="showNotification('Turn Port!'); window.globalSimulationData.ILCA.maneuver = 'turn-port'">TURN PORT</button>
      <button class="control-button button-starboard" onclick="showNotification('Turn Starboard!'); window.globalSimulationData.ILCA.maneuver = 'turn-starboard'">TURN STARBOARD</button>
    </div>
    <!-- Row 2: Heading Adjustments (Four Columns/Buttons) -->
    <div id="ilcaControl" class="input-section directional-controls"></div>  
      <div class="control-row row-adjustments">
        <button class="control-button" onclick="showNotification('ILCA Heading -5'); window.globalSimulationData.ILCA.maneuver = 'heading-minus5'">-5</button>
        <button class="control-button" onclick="showNotification('ILCA Heading -1'); window.globalSimulationData.ILCA.maneuver = 'heading-minus1'">-1</button>
        <button class="control-button" onclick="showNotification('ILCA Heading +1'); window.globalSimulationData.ILCA.maneuver = 'heading-plus1'">+1</button>
        <button class="control-button" onclick="showNotification('ILCA Heading +5'); window.globalSimulationData.ILCA.maneuver = 'heading-plus5'">+5</button>
      </div>
  </div>

  <div id="sheetControl" class="input-section">
      <div class="control-row">
        <button class="control-button" onclick="updateSheetControl(20)">20</button>
        <button class="control-button" onclick="increaseSheetControl(-1)">-1°</button>
        <button class="control-button" onclick="increaseSheetControl(1)">+1°</button>
        <button class="control-button" onclick="updateSheetControl(90)">90</button>
      </div>
  </div>

  <div id="daggerboardControl" class="input-section">
    <div class="control-column">
      <button class="control-button" onclick="updateDaggerboardControl(2)">Up</button>
      <button class="control-button" onclick="updateDaggerboardControl(1)">Mid Up</button>
      <button class="control-button" onclick="updateDaggerboardControl(0)">Center</button>
      <button class="control-button" onclick="updateDaggerboardControl(-1)">Mid Down</button>
      <button class="control-button" onclick="updateDaggerboardControl(-2)">Down</button>
    </div>
  </div>

  <div id="sailorPositionControl" class="input-section">
    <div class="control-row">
      <button class="control-button" onclick="updateSailorPosition('Fore')">Fore</button>
    </div>
    <div class="control-row">    
      <button class="control-button" onclick="updateSailorPosition('Hike Out')">Hike Out</button>
      <button class="control-button" onclick="updateSailorPosition('Mid Center')">Mid Center</button>
      <button class="control-button" onclick="updateSailorPosition('Leeward')">Leeward</button>
    </div>
    <div class="control-row">      
      <button class="control-button" onclick="updateSailorPosition('Aft')">Aft</button>
    </div>
  </div>

  <div id="vangControl" class="input-section">
    <div class="control-column">
      <button class="control-button" onclick="updateVangControl(-2)">TIGHT</button>
      <button class="control-button" onclick="updateVangControl(-1)">MID TIGHT</button>
      <button class="control-button" onclick="updateVangControl(0)">CENTER</button>
      <button class="control-button" onclick="updateVangControl(1)">MID LOOSE</button>
      <button class="control-button" onclick="updateVangControl(2)">LOOSE</button>
    </div>
  </div>

  <div id="downhaulControl" class="input-section">
    <div class="control-column">
      <button class="control-button" onclick="updateDownhaulControl(-2)">MAX LUFF</button>
      <button class="control-button" onclick="updateDownhaulControl(-1)">TRIM</button>
      <button class="control-button" onclick="updateDownhaulControl(0)">BASE</button>
      <button class="control-button" onclick="updateDownhaulControl(1)">TWIST</button>
      <button class="control-button" onclick="updateDownhaulControl(2)">OFF</button>
    </div>
  </div>

  <div id="outhaulControl" class="input-section">
    <div class="control-column">
      <button class="control-button" onclick="updateOuthaulControl(-2)">FLAT</button>
      <button class="control-button" onclick="updateOuthaulControl(-1)">BLENDED</button>
      <button class="control-button" onclick="updateOuthaulControl(0)">BASE</button>
      <button class="control-button" onclick="updateOuthaulControl(1)">DEEP</button>
      <button class="control-button" onclick="updateOuthaulControl(2)">FULL</button>
    </div>
  </div>

</div>

<style>
    .directional-controls {
    display: flex;
    flex-direction: column;
    gap: 10px; /* Adjust spacing between row 1 and row 2 */
  }

  .control-row {
    display: flex;
    gap: 10px; /* Adjust spacing between buttons in the same row */
  }

  /* Row 1 splits equally into 2 columns */
  .row-directions .control-button {
    flex: 1;
  }

  /* Row 2 splits equally into 4 columns */
  .row-adjustments .control-button {
    flex: 1;
  }
</style>


<style>
/* Container Layout */
#input-pane {
  display: flex;
  flex-direction: column;
  height: 300px;       /* Forces the pane to match the dashboard's 300px height */
  background: #000;    /* Dark background to match the black divider theme */
  padding: 6px;        /* Matches the outer border spacing */
  box-sizing: border-box;
}

/* Hide inactive sections cleanly */
.input-section:not(.active) {
  display: none !important;
}

/* Make active sections fill the container entirely */
.input-section.active {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: 100%;
  width: 100%;
  gap: 6px;            /* Matches the black gap thickness from the dashboard */
  box-sizing: border-box;
}



/* Left and Right columns (Turn Starboard / Turn Port) */
.control-side-column {
  display: flex;
  flex-direction: column;
  flex: 1;
  height: 100%;
}

/* Middle column with the 3 stacked numbers */
.control-center-column {
  display: flex;
  flex-direction: column;
  flex: 1;
  height: 100%;
  gap: 6px;            /* Uniform spacing between -5, -1, +1 */
}

/* Column layouts stretch buttons vertically */
.control-column {
  display: flex;
  flex-direction: column;
  height: 100%;
  gap: 6px;
}

/* Row layouts distribute buttons horizontally across the screen */
.control-row {
  display: flex;
  flex-direction: row;
  width: 100%;
  height: 100%;
  gap: 6px;               /* Adds uniform spacing between buttons */
}

/* Buttons stretch to fill 100% of their available space evenly */
.control-button {
  background: #007bff;
  color: white;
  border: none;
  flex: 1;                  /* Forces buttons in a row/column to share space equally */
  height: 100%;
  margin: 0;
  padding: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-weight: bold;
  font-size: 1.1rem;
  box-sizing: border-box;
  text-transform: uppercase;
}
</style>
