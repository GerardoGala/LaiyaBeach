<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Race Finish</title>
  <link rel="stylesheet" href="/partials/css/partials.css">
</head>
<body>
  <div class="dialog-box">
    <h3>🏁 Race Finished</h3>

    <p class="intro">
      Congratulations sailor! 
      Your elapsed time is recorded below.
    </p>

    <section>
      <h4>Your Time</h4>
      <p id="finishTime">
        <!-- JS will inject the elapsed time here -->
      </p>
    </section>

    <section>
      <button onclick="document.getElementById('finishDialog').style.display='none'">
        Close
      </button>
    </section>
  </div>
</body>
</html>
