<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Laiya Beach ILCA Simulator</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
  <!-- Placeholder for controls -->
  <div id="controls"></div>

  <!-- Right Pane (Map) -->
  <div class="right-pane">
    <div id="map"></div>
    <button id="mapLaunchBtn">Launch</button>
  </div>

  <!-- Fullscreen Dialogs -->
  <div id="helpDialog" class="dialog">
    <div class="dialog-content">
      <h2>Help</h2>
      <p>Instructions on how to use the simulator...</p>
      <button class="close-dialog" data-target="helpDialog">Close</button>
    </div>
  </div>

  <div id="leaderboardDialog" class="dialog">
    <div class="dialog-content">
      <h2>Top Ten Finishers</h2>
      <ol>
        <li>Player 1</li>
        <li>Player 2</li>
        <!-- etc -->
      </ol>
      <button class="close-dialog" data-target="leaderboardDialog">Close</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="js/globalSimulationData.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/dialogs.js"></script>

  <!-- Loader for controls partial -->
  <script>
    async function loadPartial(id, file) {
      const res = await fetch(file);
      document.getElementById(id).innerHTML = await res.text();
    }
    loadPartial("controls", "partials/controls.html");

    // Map launch button logic
    const mapLaunchBtn = document.getElementById('mapLaunchBtn');
    if (mapLaunchBtn) {
      mapLaunchBtn.addEventListener('click', () => {
        window.globalSimulationData.ILCA.maneuver = "launch";
        launchSimulation();
        mapLaunchBtn.style.display = 'none';
        document.getElementById('map').style.display = 'block';
      });
    }
  </script>
</body>
</html>
