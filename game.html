<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Laiya Beach ILCA Simulator</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
  <!-- Left Pane -->
  <div class="left-pane">
    <!-- Icon Buttons (Top Left) -->
    <div class="tabs">
      <span class="material-icons open-dialog" data-target="leaderboardDialog">leaderboard</span>
      <span class="material-icons open-dialog" data-target="helpDialog">help_outline</span>
    </div>

    <!-- Rigging Controls -->
    <div id="rigging" class="tab-content active">
        <div id="sheetControl" class="right-4col cell" data-angle="15" 
            style="background: rgba(0,0,0,0.1); padding: 6px; border-radius: 8px; text-align: center;">

          <!-- Group label spans all columns -->
          <div style="font-weight: bold; color: white; margin-top: 8px; grid-column: 1 / -1;">
            SHEET CONTROL
          </div>

          <!-- Buttons -->
          <button id="btnSheet90" class="control-button" onclick="executeSheet90()">90</button>
          
          <button id="btnSheetPlus" class="control-button" 
                  onclick="window.adjustSheet(1)" 
                  style="background: white; color: black; font-weight: bold;">
            +1°
          </button>
          
          <button id="btnSheetMinus" class="control-button" 
                  onclick="window.adjustSheet(-1)" 
                  style="background: white; color: black; font-weight: bold;">
            -1°
          </button>
          
          <button id="btnSheet20" class="control-button" onclick="executeSheet20()">20</button>
        </div>

        <div id="tillerControl" class="right-4col cell" data-angle="0" 
            style="background: rgba(0,0,0,0.1); padding: 6px; border-radius: 8px; text-align: center;">

          <!-- Group label spans all columns -->
          <div style="font-weight: bold; color: white; margin-top: 8px; grid-column: 1 / -1;">
            TILLER CONTROL
          </div>

          <!-- Buttons -->
          <button id="btnTack" class="control-button" onclick="executeTack()">Tack</button>
          
          <button id="btnPlus" class="control-button" 
                  onclick="window.adjustHeading(1)" 
                  style="background: white; color: black; font-weight: bold;">
            +1°
          </button>
          
          <button id="btnMinus" class="control-button" 
                  onclick="window.adjustHeading(-1)" 
                  style="background: white; color: black; font-weight: bold;">
            -1°
          </button>
          
          <button id="btnGybe" class="control-button" onclick="executeGybe()">Gybe</button>
        </div>

        <div id="tuningControlsGroup" class="right-3col">
          <div class="cell">
            <svg id="vangControl" width="60" height="150" viewBox="0 0 60 150">
              <rect x="0" y="0" width="60" height="20" rx="4" fill="#333" />
              <text x="30" y="14" text-anchor="middle" fill="white" style="font-family: Arial; font-size: 9px; font-weight: bold;">VANG</text>
              <g style="cursor: pointer;" onclick="updateControl('vang', 1)">
                <rect x="5" y="25" width="50" height="40" rx="8" fill="#28a745" />
                <text x="30" y="52" text-anchor="middle" fill="white" style="font-family: Arial; font-size: 30px; font-weight: bold;">+</text>
              </g>
              <rect x="5" y="70" width="50" height="30" rx="4" fill="white" stroke="#ccc" />
              <text id="vangValue" data-vang="0" x="30" y="92" text-anchor="middle" fill="#333" style="font-family: monospace; font-size: 20px; font-weight: bold;">0</text>
              <g style="cursor: pointer;" onclick="updateControl('vang', -1)">
                <rect x="5" y="105" width="50" height="40" rx="8" fill="#dc3545" />
                <text x="30" y="132" text-anchor="middle" fill="white" style="font-family: Arial; font-size: 35px; font-weight: bold;">-</text>
              </g>
            </svg>
          </div>
          <div class="cell">
            <svg id="downhaulControl" width="60" height="150" viewBox="0 0 60 150">
              <rect x="0" y="0" width="60" height="20" rx="4" fill="#333" />
              <text x="30" y="14" text-anchor="middle" fill="white" style="font-family: Arial; font-size: 8px; font-weight: bold;">DOWNHAUL</text>
              <g style="cursor: pointer;" onclick="updateControl('downhaul', 1)">
                <rect x="5" y="25" width="50" height="40" rx="8" fill="#28a745" />
                <text x="30" y="52" text-anchor="middle" fill="white" style="font-family: Arial; font-size: 30px; font-weight: bold;">+</text>
              </g>
              <rect x="5" y="70" width="50" height="30" rx="4" fill="white" stroke="#ccc" />
              <text id="downhaulValue" data-downhaul="0" x="30" y="92" text-anchor="middle" fill="#333" style="font-family: monospace; font-size: 20px; font-weight: bold;">0</text>
              <g style="cursor: pointer;" onclick="updateControl('downhaul', -1)">
                <rect x="5" y="105" width="50" height="40" rx="8" fill="#dc3545" />
                <text x="30" y="132" text-anchor="middle" fill="white" style="font-family: Arial; font-size: 35px; font-weight: bold;">-</text>
              </g>
            </svg>
          </div>
          <div class="cell">
            <svg id="outhaulControl" width="60" height="150" viewBox="0 0 60 150">
              <rect x="0" y="0" width="60" height="20" rx="4" fill="#333" />
              <text x="30" y="14" text-anchor="middle" fill="white" style="font-family: Arial; font-size: 9px; font-weight: bold;">OUTHAUL</text>
              <g style="cursor: pointer;" onclick="updateControl('outhaul', 1)">
                <rect x="5" y="25" width="50" height="40" rx="8" fill="#28a745" />
                <text x="30" y="52" text-anchor="middle" fill="white" style="font-family: Arial; font-size: 30px; font-weight: bold;">+</text>
              </g>
              <rect x="5" y="70" width="50" height="30" rx="4" fill="white" stroke="#ccc" />
              <text id="outhaulValue" data-outhaul="0" x="30" y="92" text-anchor="middle" fill="#333" style="font-family: monospace; font-size: 20px; font-weight: bold;">0</text>
              <g style="cursor: pointer;" onclick="updateControl('outhaul', -1)">
                <rect x="5" y="105" width="50" height="40" rx="8" fill="#dc3545" />
                <text x="30" y="132" text-anchor="middle" fill="white" style="font-family: Arial; font-size: 35px; font-weight: bold;">-</text>
              </g>
            </svg>
          </div>
        </div>
    </div>

    <!-- Permanent Status (Bottom Left) -->
    <div class="status">
      <h2>Wind</h2>
      <p id="wind">Wind data loading...</p>
    </div>
    <div class="status">
      <h2>ILCA</h2>
      <p id="ilca">ILCA data loading...</p>
    </div>
  </div>

  <!-- Right Pane (Map) -->
  <div class="right-pane">
    <div id="map"></div>
    <button id="mapLaunchBtn">Launch</button>
  </div>

  <!-- Fullscreen Dialogs -->
  <div id="helpDialog" class="dialog">
    <div class="dialog-content">
      <h2>Help</h2>
      <p>Instructions on how to use the simulator...</p>
      <button class="close-dialog" data-target="helpDialog">Close</button>
    </div>
  </div>

  <div id="leaderboardDialog" class="dialog">
    <div class="dialog-content">
      <h2>Top Ten Finishers</h2>
      <ol>
        <li>Player 1</li>
        <li>Player 2</li>
        <!-- etc -->
      </ol>
      <button class="close-dialog" data-target="leaderboardDialog">Close</button>
    </div>
  </div>

  <!-- Load Leaflet -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Root orchestrator as ES module -->
  <script type="module" src="js/app.js"></script>
  <!-- Tab/Dialog logic separated -->
  <script type="module" src="js/tabs.js"></script>
</body>
</html>
