<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Laiya Beach ILCA Simulator</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <meta name="viewport" content="width=device-width, initial-scale=.5">
</head>
<body>
  <div class="container">
    <div id="map">
      <button id="mapLaunchBtn">Launch</button>
      <div id="notification-container"></div>
    </div>
    <div id="controls"></div>
  </div>


 



  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="js/globalSimulationData.js"></script>
  <script type="module" src="js/app.js"></script>

  <!-- Loader for controls partial -->
  <script>
    async function loadPartial(id, file) {
      const res = await fetch(file);
      document.getElementById(id).innerHTML = await res.text();
    }
    loadPartial("controls", "partials/controls.html");

    // Map launch button logic
    const mapLaunchBtn = document.getElementById('mapLaunchBtn');
    if (mapLaunchBtn) {
      mapLaunchBtn.addEventListener('click', () => {
        window.globalSimulationData.ILCA.maneuver = "launch";
        launchSimulation();
        mapLaunchBtn.style.display = 'none';
        document.getElementById('map').style.display = 'block';
      });
    }
  </script>

  <script>
    function showNotification(message) {
      const container = document.getElementById('notification-container');
      const note = document.createElement('div');
      note.className = 'notification';
      note.textContent = message;
      container.appendChild(note);

      setTimeout(() => note.remove(), 2500);
    }
  </script>

  <script>
    function updateSailorPosition(position) {
      showNotification('Sailor Position: ' + position);
      window.globalSimulationData.ILCA.sailorPosition = position;
      
      // Update only the label, not the whole container
      document.getElementById('sailorPositionLabel').textContent = 
          'SAILOR POSITION = ' + position;
    }
  </script>
  <script>
    function updateSheetControl(sheet) {
      showNotification('Sheet: ' + sheet);
      window.globalSimulationData.ILCA.sheet = sheet;
      
      // Update only the label, not the whole container
      document.getElementById('sheetControlDiv').textContent = 
          'SHEET CONTROL = ' + sheet;
    }
  </script>
  <script>
    function increaseSheetControl(sheet) {
      window.globalSimulationData.ILCA.sheet = window.globalSimulationData.ILCA.sheet + sheet;
      showNotification('Sheet: ' + window.globalSimulationData.ILCA.sheet);
      // Update only the label, not the whole container
      document.getElementById('sheetControlDiv').textContent = 
          'SHEET CONTROL = ' + window.globalSimulationData.ILCA.sheet;
    }
  </script>
  <script>
    function updateDaggerboardControl(daggerboard) {
      showNotification('Daggerboard: ' + daggerboard);
      window.globalSimulationData.ILCA.daggerboard = daggerboard;
      
      // Update only the label, not the whole container
      document.getElementById('daggerboardControlDiv').textContent = 
          'DAGGERBOARD CONTROL = ' + window.globalSimulationData.ILCA.daggerboard;
    }
  </script>
  <script>
    function updateVangControl(vang) {
      showNotification('Vang: ' + vang);
      window.globalSimulationData.ILCA.vang = vang;
      
      // Update only the label, not the whole container
      document.getElementById('vangControlDiv').textContent = 
          'VANG CONTROL = ' + window.globalSimulationData.ILCA.vang;
    }
  </script>
  <script>
    function updateDownhaulControl(downhaul) {
      showNotification('Downhaul: ' + downhaul);
      window.globalSimulationData.ILCA.downhaul = downhaul;
      
      // Update only the label, not the whole container
      document.getElementById('downhaulControlDiv').textContent = 
          'DOWNHAUL CONTROL = ' + window.globalSimulationData.ILCA.downhaul;
    }
  </script>
  </script>
  <script>
    function updateOuthaulControl(outhaul) {
      showNotification('Outhaul: ' + outhaul);
      window.globalSimulationData.ILCA.outhaul = outhaul;
      
      // Update only the label, not the whole container
      document.getElementById('outhaulControlDiv').textContent = 
          'OUTHAUL CONTROL = ' + window.globalSimulationData.ILCA.outhaul;
    }
  </script>
</body>

</html>


<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "Segoe UI", sans-serif;
  background-color: #1e1e1e;
  color: #d4d4d4;
}

/* Default: mobile layout (vertical stack) */
.container {
  display: flex;
  flex-direction: column; 
  height: 100vh;
}

#map {
  flex: 1;
  width: 100%;
  border-bottom: 2px solid #333;
}

#controls {
  flex: 1;
  overflow-y: auto;
  background-color: #111;
  padding: 12px;
}



/* Desktop/Laptop: switch to side-by-side */
@media screen and (min-width: 768px) {
  .container {
    flex-direction: row; /* forces horizontal split */
  }
  #map {
    flex: 1; 
    width: auto; /* allows layout to shrink side-by-side */
    border-bottom: none;
  }
  #controls {
    flex: 0 0 300px; 
    width: 300px;
    max-width: 300px;
    border-right: 2px solid #333;
  }
}

</style>



<style>
  #notification-container {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
  }
  .notification {
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 10px 20px;
    margin-top: 10px;
    border-radius: 5px;
    font-size: 14px;
    opacity: 0;
    animation: slideUpFade 2.5s forwards;
  }
  @keyframes slideUpFade {
    0% { transform: translateY(30px); opacity: 0; }
    20% { transform: translateY(0); opacity: 1; }
    80% { transform: translateY(-10px); opacity: 1; }
    100% { transform: translateY(-20px); opacity: 0; }
  }
</style>

<style>
/* General button styling */
.control-button {
  flex: 1;                /* equal width within row */
  min-width: 0;           /* prevents overflow pushing siblings */
  text-align: center;
  font-size: clamp(10px, 1.5vw, 16px); /* text shrinks/grows to fit */
  white-space: normal;    /* allow wrapping if needed */
  padding: 8px;
  background-color: #222;
  border: 1px solid #444;
  color: #d4d4d4;
  border-radius: 4px;
  margin: 2px;            /* spacing between buttons */
}

/* Rows that contain multiple buttons */
#sheetControl div,
#daggerboardControl div,
#sailorPositionControl div,
#ilcaControl div,
#vangControl div,
#downhaulControl div,
#outhaulControl div{
  display: flex;          /* lay out buttons in a row */
  gap: 6px;               /* consistent spacing */
  justify-content: center;
}
</style>
