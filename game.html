<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Laiya Beach ILCA Simulator</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
  <!-- Placeholder for controls -->
  <div id="controls"></div>

  <div id="notification-container"></div>

  <!-- Right Pane (Map) -->
  <div class="right-pane">
    <div id="map"></div>
    <button id="mapLaunchBtn">Launch</button>
  </div>



  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="js/globalSimulationData.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/dialogs.js"></script>

  <!-- Loader for controls partial -->
  <script>
    async function loadPartial(id, file) {
      const res = await fetch(file);
      document.getElementById(id).innerHTML = await res.text();
    }
    loadPartial("controls", "partials/controls.html");

    // Map launch button logic
    const mapLaunchBtn = document.getElementById('mapLaunchBtn');
    if (mapLaunchBtn) {
      mapLaunchBtn.addEventListener('click', () => {
        window.globalSimulationData.ILCA.maneuver = "launch";
        launchSimulation();
        mapLaunchBtn.style.display = 'none';
        document.getElementById('map').style.display = 'block';
      });
    }
  </script>

  <script>
    function showNotification(message) {
      const container = document.getElementById('notification-container');
      const note = document.createElement('div');
      note.className = 'notification';
      note.textContent = message;
      container.appendChild(note);

      setTimeout(() => note.remove(), 2500);
    }
  </script>

  <script>
    function updateSailorPosition(position) {
      showNotification('Sailor Position: ' + position);
      window.globalSimulationData.ILCA.sailorPosition = position;
      
      // Update only the label, not the whole container
      document.getElementById('sailorPositionLabel').textContent = 
          'SAILOR POSITION = ' + position;
    }
  </script>
</body>

</html>


<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background-color: #1e1e1e;
  color: #d4d4d4;
  height: 100vh;
  display: flex;
  flex-direction: row;
  overflow: hidden;   /* stop the whole page from scrolling */
}

.left-pane {
  width: 300px;          /* fixed width, adjust to taste */
  flex: 0 0 300px;       /* don’t let flexbox shrink or grow it */
  display: flex;
  flex-direction: column;
  background: #252525;
}

.right-3col {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}


.right-pane {
    flex: 1;               /* takes up the remaining space */
  display: flex;
  position: absolute;
  top: 0;
  left: 300px;        /* same as controls width */
  right: 0;
  bottom: 0;
}


#map {
    flex: 1;
  width: 100%;
  height: 100%;
}



#leftPane {
  display: grid;              /* or flex */
  grid-template-columns: 1fr; /* single column */
  grid-auto-rows: min-content;
  gap: 12px;                  /* spacing between groups */
  padding: 12px;
  background: rgba(20,20,20,0.8); /* dark background */
  border-radius: 8px;
}

#controls {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 300px;       /* fixed width for left pane */
  overflow-y: auto;   /* scroll only inside controls */
  background-color: #111;
}

</style>

<style>
#notification-container {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
}

.notification {
  background: rgba(0,0,0,0.8);
  color: #fff;
  padding: 10px 20px;
  margin-top: 10px;
  border-radius: 5px;
  font-size: 14px;
  opacity: 0;
  animation: slideUpFade 2.5s forwards;
}

@keyframes slideUpFade {
  0% { transform: translateY(30px); opacity: 0; }
  20% { transform: translateY(0); opacity: 1; }
  80% { transform: translateY(-10px); opacity: 1; }
  100% { transform: translateY(-20px); opacity: 0; }
}



</style>
