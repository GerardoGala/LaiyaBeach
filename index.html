<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Laiya Beach ILCA Simulator</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<!-- Toolbar -->
<div id="toolbar">
  <span class="material-icons" id="riggingIcon">build</span>
  <span class="material-icons" id="launchIcon">sailing</span>
  <span class="material-icons" id="runningIcon">directions_boat</span>
  <span class="material-icons" id="leaderboardIcon">leaderboard</span>
</div>

<!-- Somewhere in index.html -->
<div id="windInfo">Wind data loading...</div>



  <!-- Fullscreen Map -->
  <div id="map"></div>

  <!-- Modals -->
  <div id="riggingModal" class="modal">
    <h2>Rigging Controls</h2>
    <label>Vang <input type="range"></label>
    <label>Cunningham <input type="range"></label>
    <label>Outhaul <input type="range"></label>
    <button onclick="closeModal('riggingModal')">Close</button>
  </div>

  <div id="launchModal" class="modal">
    <h2>Launch Command</h2>
    <button onclick="launchBoat()">Launch ILCA</button>
    <button onclick="closeModal('launchModal')">Close</button>
  </div>

  <div id="runningModal" class="modal">
    <h2>Running Controls</h2>
    <label>Mainsheet <input type="range"></label>
    <label>Rudder <input type="range"></label>
    <button onclick="closeModal('runningModal')">Close</button>
  </div>

  <div id="leaderboardModal" class="modal">
    <h2>Top Ten Finishers</h2>
    <ol>
      <li>Player 1</li>
      <li>Player 2</li>
      <!-- etc -->
    </ol>
    <button onclick="closeModal('leaderboardModal')">Close</button>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
