<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Laiya Beach ILCA Simulator</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #1e1e1e;
      color: #ddd;
      height: 100vh;
      display: flex;
      flex-direction: row;
    }

    .left-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #252525;
    }

    .tabs {
      display: flex;
      justify-content: space-around;
      background: #2a2a2a;
      border-bottom: 2px solid #333;
      padding: 10px;
    }

    .tab-button {
      cursor: pointer;
      color: #ddd;
      font-size: 32px;
      position: relative;
    }

    .tab-button:hover {
      color: #fff;
    }

    /* Tooltip styling */
    .tab-button::after {
      content: attr(data-label);
      position: absolute;
      bottom: -25px;
      left: 50%;
      transform: translateX(-50%);
      background: #444;
      color: #fff;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .tab-button:hover::after {
      opacity: 1;
    }

    .tab-content {
      flex: 2;
      padding: 15px;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .status {
      flex: 1;
      padding: 15px;
      border-top: 2px solid #333;
    }

    .status h2 {
      margin-top: 0;
      color: #fff;
    }

    .right-pane {
      flex: 3;
      display: flex;
    }

    #map {
      flex: 1;
    }
  </style>
</head>
<body>
  <!-- Left Pane -->
  <div class="left-pane">
    <!-- Icon Tabs (Top Left) -->
    <div class="tabs">
      <span class="material-icons tab-button active" data-tab="standing" data-label="Standing Rig">build</span>
      <span class="material-icons tab-button" data-tab="launch" data-label="Launch">sailing</span>
      <span class="material-icons tab-button" data-tab="leaderboard" data-label="Leaderboard">leaderboard</span>
      <span class="material-icons tab-button" data-tab="help" data-label="Help">help_outline</span>
    </div>

    <!-- Tab Contents -->
    <div id="standing" class="tab-content active">
      <h2>Standing Rig Controls</h2>
      <label>Vang <input type="range"></label><br>
      <label>Cunningham <input type="range"></label><br>
      <label>Outhaul <input type="range"></label>
    </div>

    <div id="launch" class="tab-content">
      <h2>Running Rig Controls</h2>
      <label>Mainsheet <input type="range"></label><br>
      <label>Rudder <input type="range"></label>
    </div>

    <div id="leaderboard" class="tab-content">
      <h2>Top Ten Finishers</h2>
      <ol>
        <li>Player 1</li>
        <li>Player 2</li>
        <!-- etc -->
      </ol>
    </div>

    <div id="help" class="tab-content">
      <h2>Help</h2>
      <p>Instructions on how to use the simulator...</p>
    </div>

    <!-- Permanent Status (Bottom Left) -->
    <div class="status">
      <h2>Wind</h2>
      <p id="wind">Wind data loading...</p>
    </div>
      <div class="status">
      <h2>ILCA</h2>
      <p id="ilca">ILCA data loading...</p>
    </div>
  </div>

  <!-- Right Pane (Map) -->
  <div class="right-pane">
    <div id="map"></div>
  </div>

  <!-- Load Leaflet -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Root orchestrator as ES module -->
  <script type="module" src="js/app.js"></script>
  <!-- Tab logic separated -->
  <script type="module" src="js/tabs.js"></script>
</body>
</html>
